name: Checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ./code
      - run: python -m unittest discover -s code/tests
      - run: searchablecity index --input examples/demo.csv --output runs/demo.sqlite
      - run: searchablecity search --database runs/demo.sqlite --query '"traffic light"' --output runs/demo.geojson --geojson
  visualization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visualization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visualization/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
